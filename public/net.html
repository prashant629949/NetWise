  <script>

    const modal = document.getElementById("passwordModal");
    const openBtn = document.getElementById("openPasswordModal");
    const closeBtn = document.getElementById("closeModal");
    const body = document.body;

    // Show modal
    openBtn.addEventListener("click", () => {
      modal.classList.remove("hidden");
      body.classList.add("blur");
    });

    // Close modal
    closeBtn.addEventListener("click", () => {
      modal.classList.add("hidden");
      body.classList.remove("blur");
    });

    // Close modal when clicking outside the box
    window.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.add("hidden");
        body.classList.remove("blur");
      }
    });

    const pp = document.getElementById('pp');
    const b1 = document.getElementById('b1');
    const uploadphoto = document.getElementById('uploadphoto');
    const b2 = document.getElementById('b2');

    // Show/hide profile box
    pp.addEventListener('click', (e) => {
      e.stopPropagation(); // Prevent document click from firing
      b1.classList.toggle('hidden');
    });

    // Hide profile box when clicking anywhere else
    document.addEventListener('click', () => {
      b1.classList.remove('hidden');
      b2.classList.remove('hidden');
    });

    // Prevent hiding when clicking inside the box
    b1.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // Toggle upload photo box
    uploadphoto.addEventListener('click', (e) => {
      e.stopPropagation(); // Prevent closing immediately
      b2.classList.toggle('hidden');
    });
    const set = document.getElementById('set');
    const da = document.getElementById('da')

    set.addEventListener('click', () => {
      da.classList.toggle('hidden');
    });

    //for get the user name who is just loged in
    async function loadUser() {
      const token = localStorage.getItem("token");
      console.log("Token", token)

      if (!token) {
        alert("Please log in first!");
        window.location.href = "/login.html";
        return;
      }

      const res = await fetch("/api/auth/welcome", {
        headers: { "Authorization": `Bearer ${token}` }
      });

      const data = await res.json();
      if (data.success) {
        document.getElementById("username").innerText = data.user.username;
        document.getElementById("usernames").innerText = data.user.username;
      } else {
        alert("Access denied! Please log in again.");
        window.location.href = "/login.html";
      }
    }
    loadUser();

    //for uploading the images
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("token");
      console.log("Token", token);
      const formData = new FormData(e.target);

      const res = await fetch("/api/image/profile-upload", {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: formData,
      });

      const data = await res.json();
      if (res.ok) {
        alert("Image uploaded successfully!");
        loadUserImage();
        console.log("Image URL:", data.url);
      } else {
        alert("Error uploading image: " + data.message);
      }
    });

    //for fetching the images upload by by the loged in user
    const token = localStorage.getItem("token");

    async function loadUserImage() {
      try {
        const token = localStorage.getItem("token");

        const res = await fetch("/api/image/myimages", {
          method: "GET",
          headers: { "Authorization": `Bearer ${token}` }
        });

        const data = await res.json();

        const pics = document.querySelectorAll(".profile-pic");

        // Get latest IMAGE only (ignore videos)
        const lastImage = data.data
          .filter(f => f.type === "image")
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0];

        if (lastImage) {
          pics.forEach(img => img.src = lastImage.url);
        } else {
          pics.forEach(img => img.src = "default.png");
        }

      } catch (error) {
        console.error("Error loading image:", error);
      }
    }

    loadUserImage();




    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("token");
      const msg = document.createElement("div");
      msg.innerText = "You have been logout";
      msg.style.position = "fixed";
      msg.style.top = "20px";
      msg.style.left = "50%";
      msg.style.transform = "translateX(-50%)";
      msg.style.background = "green";
      msg.style.color = "white";
      msg.style.padding = "10px 20px";
      msg.style.borderRadius = "8px";
      msg.style.zIndex = "9999";
      msg.style.fontFamily = "sans-serif";
      document.body.appendChild(msg);

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1000);
    });

    //for fetching other user images or video
async function loadHomeFeed() {
    const token = localStorage.getItem("token");

    try {
        const res = await fetch("/api/post/feed", {
            headers: { Authorization: `Bearer ${token}` }
        });

        const data = await res.json();
        console.log("Feed posts:", data);

        const container = document.getElementById("otherUsersImagesContainer");
        if (!container) return;

        container.innerHTML = "";

        if (!data.success || data.data.length === 0) {
            container.innerHTML = `
    <p style="text-align:center;color:gray;font-size:18px;">
      No posts yet
    </p>`;
            return;
        }

        data.data.forEach(post => {
            const card = document.createElement("div");
            card.className = "post-box";

            const media =
                post.mediaType === "video"
                    ? `<video src="${post.mediaUrl}" controls class="post-media" style="width:100%; display:block;"></video>`
                    : `<img src="${post.mediaUrl}" class="post-media" style="width:100%; display:block;" />`;

            card.innerHTML = `
    <div class="post-card" style="background:white; margin-bottom:20px; border-radius:8px; box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;">
      
      <div class="post-header">
        <img 
          src="${post.uploadedBy?.profileImage || "default.png"}"
          class="user-avatar"
          data-userid="${post.uploadedBy?._id || ""}"
        />
        <span 
          class="username-link"
          style="font-weight:bold; cursor:pointer;"
          data-userid="${post.uploadedBy?._id || ""}"
        >
          ${post.uploadedBy?.username || "Unknown User"}
        </span>
      </div>

      <div class="post-caption">
          ${post.caption || ""}
      </div>

      <div class="post-body">
        ${media}
      </div>

    </div>
  `;

            container.appendChild(card);
        });

        // Redirect to user profile
        container.querySelectorAll(".username-link, .user-avatar").forEach(el => {
            el.addEventListener("click", () => {
                const userId = el.dataset.userid;
                if (!userId) return;

                localStorage.setItem("selectedUserId", userId);
                window.location.href = "user-profile.html";
            });
        });

    } catch (err) {
        console.error("Feed load error:", err);
    }
}

    window.addEventListener("DOMContentLoaded", loadHomeFeed);

    function openUserProfile(userId) {
      if (!userId) return;

      localStorage.setItem("selectedUserId", userId);
      window.location.href = "user-profile.html";
    }



    //for changing the password
    document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const oldPassword = document.getElementById("oldPassword").value.trim();
      const newpassword = document.getElementById("newPassword").value.trim();
      const token = localStorage.getItem("token");

      if (!oldPassword || !newpassword) {
        alert("Please fill in both fields!");
        return;
      }

      try {
        const res = await fetch("/api/auth/change-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
          },
          body: JSON.stringify({ oldPassword, newpassword }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          const msg = document.createElement("div");
          msg.innerText = data.message || "Password updated successfully!";
          msg.style.position = "fixed";
          msg.style.top = "20px";
          msg.style.left = "50%";
          msg.style.transform = "translateX(-50%)";
          msg.style.background = "green";
          msg.style.color = "white";
          msg.style.padding = "10px 20px";
          msg.style.borderRadius = "8px";
          msg.style.zIndex = "9999";
          msg.style.fontFamily = "sans-serif";
          document.body.appendChild(msg);

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1000);
          document.getElementById("changePasswordForm").reset();
          modal.classList.add("hidden");
          body.classList.remove("blur");
        } else {
          alert(data.message || "Failed to update password.");
        }
      } catch (e) {
        console.error(e);
        alert("Something went wrong while updating password.");
      }
    });

    //for deleting an account
    const deleteModal = document.getElementById("deleteModal");
    const openDeleteModal = document.getElementById("openDeleteModal");
    const closeDeleteModal = document.getElementById("closeDeleteModal");
    const cancelDelete = document.getElementById("cancelDelete");
    const confirmDelete = document.getElementById("confirmDelete");

    // Show modal
    openDeleteModal.addEventListener("click", () => {
      deleteModal.classList.remove("hidden");
      document.body.classList.add("blur");
    });

    //Close modal (X or Cancel button)
    closeDeleteModal.addEventListener("click", () => {
      deleteModal.classList.add("hidden");
      document.body.classList.remove("blur");
    });

    cancelDelete.addEventListener("click", () => {
      deleteModal.classList.add("hidden");
      document.body.classList.remove("blur");
    });

    // Confirm Delete
    confirmDelete.addEventListener("click", async () => {
      const token = localStorage.getItem("token");
      if (!token) {
        alert("Please login first.");
        return;
      }

      if (!confirm("This will permanently delete your account. Continue?")) return;

      try {
        const res = await fetch("/api/auth/delete-account", {
          method: "DELETE",
          headers: {
            "Authorization": `Bearer ${token}`,
          },
        });

        const data = await res.json();

        if (res.ok && data.success) {
          alert(data.message || "Account deleted successfully.");
          localStorage.removeItem("token");
          window.location.href = "/signup.html"; // redirect to signup/login
        } else {
          alert(data.message || "Failed to delete account.");
        }
      } catch (err) {
        console.error("Error deleting account:", err);
        alert("Something went wrong. Please try again later.");
      }
    });
    // for searching other user
    async function performSearch() {
      const q = document.getElementById("searchBox").value;

      if (q.length < 1) {
        document.getElementById("searchResults").innerHTML = "";
        return;
      }

      const res = await fetch(`/api/auth/search?q=${q}`);
      const data = await res.json();

      console.log("SEARCH RESULT:", data); // <-- IMPORTANT

      if (!data.success) return;

      let html = "";

      // Show USERS
      data.users.forEach(u => {
        html += `
            <div class="search-item" onclick="openUserProfile('${u._id}')">
                <img src="${u.profileImage || u.profilePic || 'default.png'}">
                <span>@${u.username}</span>
            </div>
        `;
      });

      // Show POSTS (images)
      data.posts.forEach(p => {
        html += `
            <div class="search-item">
                <img src="${p.mediaUrl}" class="small-post">
                <span>${p.caption || ''}</span>
            </div>
        `;
      });

      document.getElementById("searchResults").innerHTML = html;
    }
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const previewBox = document.querySelector(".preview-box");
    const imagePreview = document.getElementById("imagePreview");

    function openFilePicker() {
      fileInput.click();
    }

    fileInput.addEventListener("change", function () {
      if (this.files.length > 0) {
        const file = this.files[0];
        fileName.textContent = file.name;

        // Only preview images
        if (file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = function (e) {
            imagePreview.src = e.target.result;
            previewBox.style.display = "flex";
          };
          reader.readAsDataURL(file);
        } else {
          previewBox.style.display = "none";
        }
      } else {
        fileName.textContent = "No file chosen";
        previewBox.style.display = "none";
      }
    });

    function cancelUpload() {
      fileInput.value = "";              // clear file
      fileName.textContent = "No file chosen";
      imagePreview.src = "";
      previewBox.style.display = "none";
    }

    async function loadUserPosts() {
      try {
        const token = localStorage.getItem("token");

        const res = await fetch("/api/post/my-posts", {
          headers: { Authorization: `Bearer ${token}` }
        });

        const data = await res.json();

        const container = document.getElementById("imageContainer");
        container.innerHTML = "";

        if (!data.success || data.data.length === 0) {
          container.innerHTML = "<p>No posts yet</p>";
          return;
        }

        data.data.forEach(post => {
          let el;

          if (post.type === "video") {
            el = document.createElement("video");
            el.src = post.url;
            el.controls = true;
          } else {
            el = document.createElement("img");
            el.src = post.url;
          }

          el.style.width = "220px";
          el.style.height = "300px";
          el.style.objectFit = "cover";
          el.style.borderRadius = "10px";
          el.style.margin = "8px";

          container.appendChild(el);
        });

      } catch (err) {
        console.error("Post load error:", err);
      }
    }







  </script>
