<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetWise | Create Account</title>
  <link rel="website icon" type="png" href="letter-n_9871834.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="signup-page">
    <div class="signup-card">
      <div class="brand-badge">
        <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="url(#logo-grad)"/>
          <circle cx="12" cy="12" r="3" fill="#ffffff" />
          <circle cx="28" cy="12" r="3" fill="#ffffff" />
          <circle cx="12" cy="28" r="3" fill="#ffffff" />
          <circle cx="28" cy="28" r="3" fill="#ffffff" />
          <circle cx="20" cy="20" r="4.5" fill="#ffffff" />
          <line x1="12" y1="12" x2="20" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <line x1="28" y1="12" x2="20" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="28" x2="20" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <line x1="28" y1="28" x2="20" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6366f1"/>
              <stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="brand-title">Net<span>Wise</span></span>
      </div>

      <div class="card-header">
        <h1>Join the Community</h1>
        <p>Create your personal profile to share moments, post reels, and follow creators.</p>
      </div>

      <form class="box" id="signup" onsubmit="event.preventDefault(); register();">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" placeholder="Choose a unique username" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="Create a secure password" required autocomplete="new-password">
          </div>
        </div>

        <div class="terms-note">
          By continuing, you agree to NetWise's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </div>

        <button type="submit" class="submit-btn">
          <span>Create Account</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="signin-redirect">
        <span>Already have an account?</span>
        <a href="login.html">Sign In &rarr;</a>
      </div>
    </div>
  </main>

  <script>
    async function register() {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !email || !password) {
        showToast("Please fill in all fields.", "error");
        return;
      }

      const btn = document.querySelector(".submit-btn");
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span>Creating account...</span>`;
      btn.disabled = true;

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          showToast(data.message || "Account created successfully! Redirecting to login...", "success");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        } else {
          showToast(data.message || "Registration failed. Please try again.", "error");
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      } catch (err) {
        console.error("Registration error:", err);
        showToast("Network error. Please try again.", "error");
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    function showToast(message, type = "info") {
      const old = document.querySelector(".modern-toast");
      if (old) old.remove();

      const toast = document.createElement("div");
      toast.className = `modern-toast toast-${type}`;
      toast.innerHTML = `
        <span class="toast-dot"></span>
        <span>${message}</span>
      `;
      document.body.appendChild(toast);

      setTimeout(() => toast.classList.add("show"), 10);
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>

</html>
