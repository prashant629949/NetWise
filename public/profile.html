  <script>

    function openLightbox(url, type, caption) {
      const modal = document.getElementById("lightboxModal");
      const img = document.getElementById("lightboxImage");
      const vid = document.getElementById("lightboxVideo");
      const cap = document.getElementById("lightboxCaption");

      // Reset display
      img.style.display = "none";
      vid.style.display = "none";
      vid.pause(); // Stop any previous video

      if (type === "video") {
        vid.src = url;
        vid.style.display = "block";
      } else {
        img.src = url;
        img.style.display = "block";
      }

      cap.innerText = caption || ""; // Set the caption text
      modal.style.display = "flex";  // Show modal
    }

    function closeLightbox() {
      const modal = document.getElementById("lightboxModal");
      const vid = document.getElementById("lightboxVideo");
      modal.style.display = "none";
      vid.pause(); // Stop video when closing
    }

    // Close when clicking outside the image
    document.getElementById("lightboxModal").addEventListener("click", (e) => {
      if (e.target.id === "lightboxModal") {
        closeLightbox();
      }
    });

    function openPopup() {
      document.getElementById("popupOverlay").classList.remove("hidden");
      const box = document.getElementById("popupBox");
      box.classList.remove("hidden");
      setTimeout(() => box.classList.add("active"), 10);
    }

    function closePopup() {
      document.getElementById("popupOverlay").classList.add("hidden");
      const box = document.getElementById("popupBox");
      box.classList.remove("active");
      setTimeout(() => box.classList.add("hidden"), 300);
    }

    const modal = document.getElementById("passwordModal");
    const openBtn = document.getElementById("openPasswordModal");
    const closeBtn = document.getElementById("closeModal");
    const body = document.body;

    // Show modal
    openBtn.addEventListener("click", () => {
      modal.classList.remove("hidden");
      body.classList.add("blur");
    });

    // Close modal
    closeBtn.addEventListener("click", () => {
      modal.classList.add("hidden");
      body.classList.remove("blur");
    });

    // Close modal when clicking outside the box
    window.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.add("hidden");
        body.classList.remove("blur");
      }
    });

    const pp = document.getElementById('pp');
    const b1 = document.getElementById('b1');
    const uploadphoto = document.getElementById('uploadphoto');
    const b2 = document.getElementById('b2');

    // Show/hide profile box
    pp.addEventListener('click', (e) => {
      e.stopPropagation(); // Prevent document click from firing
      b1.classList.toggle('hidden');
    });

    // Hide profile box when clicking anywhere else
    document.addEventListener('click', () => {
      b1.classList.remove('hidden');
      b2.classList.remove('hidden');
    });

    // Prevent hiding when clicking inside the box
    b1.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // Toggle upload photo box
    uploadphoto.addEventListener('click', (e) => {
      e.stopPropagation(); // Prevent closing immediately
      b2.classList.toggle('hidden');
    });
    const set = document.getElementById('set');
    const da = document.getElementById('da')

    set.addEventListener('click', () => {
      da.classList.toggle('hidden');
    });
    //for get the user name who is just loged in
    async function loadUser() {
      const token = localStorage.getItem("token");
      console.log("Token", token)

      if (!token) {
        alert("Please log in first!");
        window.location.href = "/login.html";
        return;
      }

      const res = await fetch("/api/auth/welcome", {
        headers: { "Authorization": `Bearer ${token}` }
      });

      const data = await res.json();
      if (data.success) {
        document.getElementById("username").innerText = data.user.username;
        document.getElementById("usernames").innerText = data.user.username;
        document.getElementById("usernamess").innerText = data.user.username;
      } else {
        alert("Access denied! Please log in again.");
        window.location.href = "/login.html";
      }
    }
    loadUser();



    //for fetching the images upload by by the loged in user
    const token = localStorage.getItem("token");

    async function loadUserImage() {
      try {
        const token = localStorage.getItem("token");

        const res = await fetch("/api/image/myimages", {
          method: "GET",
          headers: { "Authorization": `Bearer ${token}` }
        });

        const data = await res.json();

        const pics = document.querySelectorAll(".profile-pic");

        // Get latest IMAGE only (ignore videos)
        const lastImage = data.data
          .filter(f => f.type === "image")
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0];

        if (lastImage) {
          pics.forEach(img => img.src = lastImage.url);
        } else {
          pics.forEach(img => img.src = "default.png");
        }

      } catch (error) {
        console.error("Error loading image:", error);
      }
    }

    loadUserImage();






    //for logout
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("token");
      const msg = document.createElement("div");
      msg.innerText = "You have been logout";
      msg.style.position = "fixed";
      msg.style.top = "20px";
      msg.style.left = "50%";
      msg.style.transform = "translateX(-50%)";
      msg.style.background = "green";
      msg.style.color = "white";
      msg.style.padding = "10px 20px";
      msg.style.borderRadius = "8px";
      msg.style.zIndex = "9999";
      msg.style.fontFamily = "sans-serif";
      document.body.appendChild(msg);

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1000);
    });


    //for changing the password
    document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const oldPassword = document.getElementById("oldPassword").value.trim();
      const newpassword = document.getElementById("newPassword").value.trim();
      const token = localStorage.getItem("token");

      if (!oldPassword || !newpassword) {
        alert("Please fill in both fields!");
        return;
      }

      try {
        const res = await fetch("/api/auth/change-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
          },
          body: JSON.stringify({ oldPassword, newpassword }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          const msg = document.createElement("div");
          msg.innerText = data.message || "Password updated successfully!";
          msg.style.position = "fixed";
          msg.style.top = "20px";
          msg.style.left = "50%";
          msg.style.transform = "translateX(-50%)";
          msg.style.background = "green";
          msg.style.color = "white";
          msg.style.padding = "10px 20px";
          msg.style.borderRadius = "8px";
          msg.style.zIndex = "9999";
          msg.style.fontFamily = "sans-serif";
          document.body.appendChild(msg);

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1000);
          document.getElementById("changePasswordForm").reset();
          modal.classList.add("hidden");
          body.classList.remove("blur");
        } else {
          alert(data.message || "Failed to update password.");
        }
      } catch (e) {
        console.error(e);
        alert("Something went wrong while updating password.");
      }
    });

    //for deleting an account
    // Elements
    const deleteModal = document.getElementById("deleteModal");
    const openDeleteModal = document.getElementById("openDeleteModal");
    const closeDeleteModal = document.getElementById("closeDeleteModal");
    const cancelDelete = document.getElementById("cancelDelete");
    const confirmDelete = document.getElementById("confirmDelete");

    // Show modal
    openDeleteModal.addEventListener("click", () => {
      deleteModal.classList.remove("hidden");
      document.body.classList.add("blur");
    });

    // Close modal (X or Cancel button)
    closeDeleteModal.addEventListener("click", () => {
      deleteModal.classList.add("hidden");
      document.body.classList.remove("blur");
    });

    cancelDelete.addEventListener("click", () => {
      deleteModal.classList.add("hidden");
      document.body.classList.remove("blur");
    });

    // Confirm Delete
    confirmDelete.addEventListener("click", async () => {
      const token = localStorage.getItem("token");
      if (!token) {
        alert("Please login first.");
        return;
      }

      if (!confirm("This will permanently delete your account. Continue?")) return;

      try {
        const res = await fetch("/api/auth/delete-account", {
          method: "DELETE",
          headers: {
            "Authorization": `Bearer ${token}`,
          },
        });

        const data = await res.json();

        if (res.ok && data.success) {
          alert(data.message || "Account deleted successfully.");
          localStorage.removeItem("token");
          window.location.href = "/signup.html"; // redirect to signup/login
        } else {
          alert(data.message || "Failed to delete account.");
        }
      } catch (err) {
        console.error("Error deleting account:", err);
        alert("Something went wrong. Please try again later.");
      }
    });




    async function loadUserPosts() {
      try {
        const token = localStorage.getItem("token");
        const container = document.getElementById("imageContainer");

        container.innerHTML = "";

        const res = await fetch("/api/post/my-posts", {
          headers: { Authorization: `Bearer ${token}` }
        });

        const data = await res.json();

        if (!data.success || !data.data.length) {
          container.innerHTML = "<p>No posts yet</p>";
          return;
        }

        data.data.forEach(post => {
          let el;

          if (post.mediaType === "video") {
            el = document.createElement("video");
            el.src = post.mediaUrl;
            // Don't show controls on thumbnail to make it look cleaner, 
            // or keep controls=true if you prefer.
            el.controls = false;
          } else {
            el = document.createElement("img");
            el.src = post.mediaUrl;
          }

          // Style the thumbnail
          el.classList.add("user-image");
          el.dataset.id = post._id;
          el.dataset.owner = "true";
          el.style.width = "220px";
          el.style.height = "300px";
          el.style.objectFit = "cover";
          el.style.borderRadius = "12px";
          el.style.margin = "10px";
          el.style.cursor = "pointer";

          // CLICK EVENT: Open Lightbox with Caption
          el.onclick = () => {
            openLightbox(post.mediaUrl, post.mediaType, post.caption);
          };

          // Attach your existing delete handlers (Right click / Long press)
          attachDeleteHandlers(el);

          container.appendChild(el);
        });

      } catch (err) {
        console.error("Post load error:", err);
      }
    }




    window.addEventListener("DOMContentLoaded", () => {
      loadUserImage();   // profile picture
      loadUserPosts();   // posts feed
    });






    // Close popup
    function closeUsernamePopup() {
      document.getElementById("usernameModal").classList.add("hidden");
    }

    // Update username
    async function updateUsername() {
      const newUsername = document.getElementById("newUsername").value.trim();
      const token = localStorage.getItem("token");

      if (!newUsername) {
        alert("Please enter a username!");
        return;
      }

      const res = await fetch("/api/auth/update-username", {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`,
        },
        body: JSON.stringify({ username: newUsername }),
      });

      const data = await res.json();

      if (data.success) {
        alert("Username updated successfully!");

        localStorage.removeItem("token");
        window.location.href = "login.html";
      } else {
        alert(data.message || "Error updating username.");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {

      const profileForm = document.getElementById("profileUploadForm");
      const postForm = document.getElementById("postUploadForm");

      if (profileForm) {
        profileForm.addEventListener("submit", async (e) => {
          e.preventDefault();

          const token = localStorage.getItem("token");
          const formData = new FormData(profileForm);

          const res = await fetch("/api/image/profile-upload", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData
          });

          const data = await res.json();

          if (data.success) {
            alert("Profile picture updated!");
            loadUserImage();
          } else {
            alert(data.message || "Profile upload failed");
          }
        });
      }

      if (postForm) {
        postForm.addEventListener("submit", async (e) => {
          e.preventDefault();

          const token = localStorage.getItem("token");
          const formData = new FormData(postForm);

          const res = await fetch("/api/post/upload", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData
          });

          const data = await res.json();

          if (data.success) {
            alert("Post uploaded!");
            postForm.reset();
            loadUserPosts();
          } else {
            alert(data.message || "Post upload failed");
          }
        });
      }

    });

    const profileFileInput = document.getElementById("profileFileInput");
    const profileFileName = document.getElementById("profileFileName");
    const profilePreviewBox = document.getElementById("profilePreviewBox");
    const profileImagePreview = document.getElementById("profileImagePreview");
    const actionButtons = document.querySelector(".action-buttons");
    const chooseWrapper = document.getElementById("chooseWrapper");

    function openProfilePicker() {
      profileFileInput.click();
    }

    profileFileInput.addEventListener("change", function () {
      if (this.files.length > 0) {
        const file = this.files[0];

        // show filename
        profileFileName.textContent = file.name;

        if (file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = (e) => {
            profileImagePreview.src = e.target.result;
            profilePreviewBox.style.display = "flex";
            actionButtons.style.display = "flex";
            chooseWrapper.style.display = "none"; // 👈 HIDE choose button
          };
          reader.readAsDataURL(file);
        }
      } else {
        resetProfileUpload();
      }
    });

    function cancelProfileUpload() {
      resetProfileUpload();
    }

    function resetProfileUpload() {
      profileFileInput.value = "";
      profileFileName.textContent = "No file chosen";
      profileImagePreview.src = "";
      profilePreviewBox.style.display = "none";
      actionButtons.style.display = "none";
      chooseWrapper.style.display = "block"; // 👈 SHOW choose button again
    }


    const postFileInput = document.getElementById("postFileInput");
    const postFileName = document.getElementById("postFileName");
    const postPreviewBox = document.getElementById("postPreviewBox");
    const postImagePreview = document.getElementById("postImagePreview");
    const postVideoPreview = document.getElementById("postVideoPreview");
    const postActionButtons = document.getElementById("postActionButtons");
    const postChooseWrapper = document.getElementById("postChooseWrapper");

    function openPostPicker() {
      postFileInput.click();
    }

    postFileInput.addEventListener("change", function () {
      if (!this.files.length) {
        resetPostUpload();
        return;
      }

      const file = this.files[0];
      postFileName.textContent = file.name;

      postChooseWrapper.style.display = "none";
      postPreviewBox.style.display = "flex";
      postActionButtons.style.display = "flex";

      // reset previews
      postImagePreview.style.display = "none";
      postVideoPreview.style.display = "none";

      if (file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = (e) => {
          postImagePreview.src = e.target.result;
          postImagePreview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }

      if (file.type.startsWith("video/")) {
        postVideoPreview.src = URL.createObjectURL(file);
        postVideoPreview.style.display = "block";
      }
    });

    function cancelPostUpload() {
      resetPostUpload();
    }

    function resetPostUpload() {
      postFileInput.value = "";
      postFileName.textContent = "No file chosen";
      postPreviewBox.style.display = "none";
      postActionButtons.style.display = "none";
      postChooseWrapper.style.display = "block";
      postImagePreview.src = "";
      postVideoPreview.src = "";
    }

    document.querySelectorAll(".user-image").forEach(img => {

      // DESKTOP right-click
      img.addEventListener("contextmenu", async (e) => {
        e.preventDefault();

        if (img.dataset.owner !== "true") return;

        if (!confirm("Delete this image?")) return;

        await deleteImage(img);
      });

    });

    async function deleteImage(img) {
      const token = localStorage.getItem("token");
      const imageId = img.dataset.id;

      try {
        const res = await fetch(`/api/post/${imageId}`, {
          method: "DELETE",
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        const data = await res.json();

        if (data.success) {
          // animate delete
          img.classList.add("fade-out");

          setTimeout(() => {
            img.remove();
          }, 300);
        } else {
          alert(data.message);
        }

      } catch (err) {
        console.error("Delete error:", err);
      }
    }

    document.querySelectorAll(".user-image").forEach(img => {
      let pressTimer;

      img.addEventListener("touchstart", () => {
        if (img.dataset.owner !== "true") return;

        pressTimer = setTimeout(() => {
          if (confirm("Delete this image?")) {
            deleteImage(img);
          }
        }, 500);
      });

      img.addEventListener("touchend", () => {
        clearTimeout(pressTimer);
      });

      img.addEventListener("touchmove", () => {
        clearTimeout(pressTimer);
      });
    });

    function attachDeleteHandlers(img) {

      // Desktop right click
      img.addEventListener("contextmenu", async (e) => {
        e.preventDefault();

        if (img.dataset.owner !== "true") return;

        if (!confirm("Delete this image?")) return;

        deleteImage(img);
      });

      // Mobile long press
      let pressTimer;

      img.addEventListener("touchstart", () => {
        if (img.dataset.owner !== "true") return;

        pressTimer = setTimeout(() => {
          if (confirm("Delete this image?")) {
            deleteImage(img);
          }
        }, 500);
      });

      img.addEventListener("touchend", () => clearTimeout(pressTimer));
      img.addEventListener("touchmove", () => clearTimeout(pressTimer));
    }


  </script>


</body>
